<header class="site-header">
  <div class="container">
    <a href="index.html" class="brand">
      <span class="brand-mark">PI</span>
      <span class="brand-name">Pellatiero<br><small>Imóveis · Passo Fundo</small></span>
    </a>
    <nav class="main-nav">
      <a href="index.html">Início</a>
      <a href="imoveis.html?negociacao=venda" class="active">Comprar</a>
      <a href="imoveis.html?negociacao=locacao">Alugar</a>
      <a href="admin.html">Anuncie seu imóvel</a>
      <a href="index.html#contato">Contato</a>
    </nav>
    <div class="header-actions">
      <a href="login.html" class="icon-link" title="Entrar" aria-label="Entrar">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.6-3.6 4.8-5.5 8-5.5s6.4 1.9 8 5.5"/></svg>
      </a>
      <a href="cadastro.html" class="btn btn-ghost btn-sm">Criar conta</a>
      <button class="nav-toggle" aria-label="Abrir menu">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
    </div>
  </div>
</header>

<section class="section" style="padding-top:44px;padding-bottom:0">
  <div class="container">
    <span class="eyebrow">Busca avançada</span>
    <h2 style="font-family:var(--font-display);font-size:32px;margin:8px 0 24px;color:var(--moss-950)">Encontre o imóvel ideal</h2>

    <div class="form-card" style="margin-bottom:36px">
      <div class="filters-panel is-open" style="margin-top:0;padding-top:0;border:none;grid-template-columns:2fr 1fr 1fr 1fr 1fr;">
        <div class="field"><label>Buscar</label><input id="filtro-busca" type="text" placeholder="Bairro, tipo, código..."></div>
        <div class="field"><label>Negociação</label>
          <select id="filtro-negociacao"><option value="">Todas</option><option value="venda">Venda</option><option value="locacao">Locação</option></select>
        </div>
        <div class="field"><label>Tipo</label>
          <select id="filtro-tipo">
            <option value="">Todos</option>
            <option>Apartamento</option><option>Casa</option><option>Casa em condomínio</option>
            <option>Comercial</option><option>Terreno</option>
          </select>
        </div>
        <div class="field"><label>Preço máximo</label><input id="filtro-preco" type="number" placeholder="Sem limite"></div>
        <div class="field"><label>Dormitórios (mín.)</label>
          <select id="filtro-quartos"><option value="">Qualquer</option><option value="1">1+</option><option value="2">2+</option><option value="3">3+</option><option value="4">4+</option></select>
        </div>
      </div>
    </div>

    <p style="color:var(--ink-soft);font-size:14px;margin-bottom:20px"><strong id="result-count">0</strong> imóveis encontrados</p>
  </div>
</section>

<section class="section" style="padding-top:0">
  <div class="container">
    <div class="card-grid" id="grid-listagem"></div>
  </div>
</section>

<footer class="site-footer">
  <div class="container">
    <div class="footer-bottom" style="border-top:none;padding:26px 0">
      <span>© <span data-year></span> Pellatiero Imóveis · CRECI 28229-J</span>
      <span><a href="tecnologias.html" style="color:#fff">Tecnologias</a></span>
    </div>
  </div>
</footer>
